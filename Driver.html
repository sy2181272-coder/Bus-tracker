<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Panel - Free Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-yellow: #FFD700;
            --dark-blue: #1A237E;
            --light-grey: #F5F5F5;
            --success-green: #2E7D32;
            --danger-red: #C62828;
            --white: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { background-color: var(--light-grey); height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header {
            background-color: var(--dark-blue);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Status Card */
        .container { padding: 25px; flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .status-card {
            background: var(--white);
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .pulse-icon {
            font-size: 60px;
            color: var(--primary-yellow);
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        #status-label { font-size: 20px; font-weight: 700; color: #555; margin-bottom: 10px; }
        #coords { font-size: 12px; color: #888; font-family: monospace; }

        /* Action Buttons */
        .btn {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-start { background-color: var(--success-green); color: white; }
        .btn-stop { background-color: var(--danger-red); color: white; display: none; }
        
        .btn:active { transform: scale(0.96); }

        .footer-note { text-align: center; font-size: 12px; color: #999; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="font-family: 'Nunito';">Driver Console</h2>
        <p style="opacity: 0.8;">Bus ID: <b id="bus-display-id">BUS-101</b></p>
    </div>

    <div class="container">
        <div class="status-card">
            <div class="pulse-icon" id="icon-box"><i class="fas fa-satellite-dish"></i></div>
            <div id="status-label">Ready to Start</div>
            <div id="coords">GPS inactive</div>
        </div>

        <button id="startBtn" class="btn btn-start" onclick="toggleTracking(true)">
            <i class="fas fa-play"></i> START TRIP
        </button>
        
        <button id="stopBtn" class="btn btn-stop" onclick="toggleTracking(false)">
            <i class="fas fa-stop"></i> STOP TRIP
        </button>

        <p class="footer-note">Keep this screen active during the trip</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // --- YOUR FIREBASE CONFIG ---
        const firebaseConfig = {
  apiKey: "AIzaSyBbKuWmmCZssyo7INjiCGXYbT_sl2PT8l0",
  authDomain: "bus-finder-8b068.firebaseapp.com",
  databaseURL: "https://bus-finder-8b068-default-rtdb.firebaseio.com",
  projectId: "bus-finder-8b068",
  storageBucket: "bus-finder-8b068.firebasestorage.app",
  messagingSenderId: "308118155363",
  appId: "1:308118155363:web:d508430eb2607a7b684856"
};
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let watchID = null;
        const busID = "bus_1710000000"; // Same as Parent Panel

        function toggleTracking(isStarting) {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const statusLabel = document.getElementById('status-label');
            const iconBox = document.getElementById('icon-box');

            if (isStarting) {
                if ("geolocation" in navigator) {
                    // UI Update
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'flex';
                    statusLabel.innerText = "Trip is LIVE";
                    statusLabel.style.color = "var(--success-green)";
                    iconBox.innerHTML = '<i class="fas fa-bus"></i>';

                    // Start GPS Watch
                    watchID = navigator.geolocation.watchPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;

                            // Send to Firebase
                            db.ref('tracking/' + busID).set({
                                lat: lat,
                                lng: lng,
                                timestamp: Date.now()
                            });

                            document.getElementById('coords').innerText = `LAT: ${lat.toFixed(5)} | LNG: ${lng.toFixed(5)}`;
                        },
                        (error) => {
                            console.error(error);
                            alert("Please enable GPS/Location permissions.");
                        },
                        { enableHighAccuracy: true, maximumAge: 0 }
                    );
                }
            } else {
                // Stop Tracking
                if (watchID) navigator.geolocation.clearWatch(watchID);
                db.ref('tracking/' + busID).remove(); // Clear live location on stop
                
                startBtn.style.display = 'flex';
                stopBtn.style.display = 'none';
                statusLabel.innerText = "Trip Ended";
                statusLabel.style.color = "#555";
                iconBox.innerHTML = '<i class="fas fa-satellite-dish"></i>';
                document.getElementById('coords').innerText = "GPS inactive";
            }
        }
    </script>
</body>
</html>
