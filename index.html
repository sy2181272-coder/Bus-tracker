<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seekho Mini</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        :root { --neon: #9d4edd; --blue: #3a86ff; --bg: #050508; --glass: rgba(20,20,30,0.8); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 450px; height: 100vh; position: relative; background: #000; display: flex; flex-direction: column; }
        .screen { position: absolute; width: 100%; height: calc(100% - 65px); display: none; overflow-y: auto; padding: 15px; }
        .screen.active { display: block; }
        #home-screen { padding: 0; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
        #home-screen::-webkit-scrollbar { display: none; }
        .reel { width: 100%; height: 100%; scroll-snap-align: start; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .actions { position: absolute; right: 15px; bottom: 30px; display: flex; flex-direction: column; gap: 20px; text-align: center; }
        .act-btn { width: 45px; height: 45px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.1); }
        .act-btn.liked i { color: #ff0054; }
        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 65px; background: rgba(5,5,8,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-item { color: #8e9aaf; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #fff; text-shadow: 0 0 10px var(--neon); transform: translateY(-3px); }
        .nav-item.center { background: linear-gradient(135deg, var(--neon), var(--blue)); width: 46px; height: 46px; border-radius: 50%; color: #fff; display: flex; justify-content: center; align-items: center; transform: translateY(-8px); box-shadow: 0 0 15px rgba(157,78,221,0.5); }
        .inp { width: 100%; padding: 14px; margin-bottom: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; outline: none; }
        .inp:focus { border-color: var(--neon); }
        .btn { background: linear-gradient(135deg, var(--neon), var(--blue)); color: #fff; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; }
        .coin-box { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: 1px solid #ffb703; padding: 5px 12px; border-radius: 20px; color: #ffb703; font-size: 0.85rem; z-index: 10; display: flex; align-items: center; gap: 5px; }
        #auth-screen { height: 100%; background: #050508; z-index: 100; display: flex; flex-direction: column; justify-content: center; padding: 25px; }
    </style>
</head>
<body>
    <div class="app">
        <!-- Coin Tracker -->
        <div class="coin-box"><i class="fa-solid fa-coins"></i> <span id="u-coins">0</span></div>

        <!-- Auth -->
        <div id="auth-screen">
            <h2 style="text-align:center; margin-bottom:30px; background: linear-gradient(135deg, var(--neon), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Seekho</h2>
            <input type="email" id="ae" class="inp" placeholder="Email">
            <input type="password" id="ap" class="inp" placeholder="Password">
            <button class="btn" onclick="authEng.go()">Sign In / Login</button>
        </div>

        <!-- Screens -->
        <div id="home-screen" class="screen active"></div>
        
        <div id="search-screen" class="screen">
            <input type="text" id="sq" class="inp" placeholder="Search topics..." oninput="searchEng.run()">
            <div id="search-res" style="margin-top:15px;"></div>
        </div>

        <div id="upload-screen" class="screen">
            <h3 style="margin-bottom:15px;">Publish Video</h3>
            <input type="text" id="v-url" class="inp" placeholder="Video MP4 URL">
            <input type="text" id="v-cap" class="inp" placeholder="Caption">
            <input type="text" id="v-cat" class="inp" placeholder="Category (e.g. Coding)">
            <button class="btn" onclick="feedEng.add()">Upload Now</button>
        </div>

        <div id="profile-screen" class="screen" style="text-align:center; padding-top:40px;">
            <div style="width:70px; height:70px; border-radius:50%; background:var(--neon); margin:0 auto 10px auto; display:flex; justify-content:center; align-items:center; font-size:1.5rem;"><i class="fa-solid fa-user"></i></div>
            <h3 id="p-name">Learner</h3>
            <p style="color:#8e9aaf; font-size:0.85rem; margin-top:5px;">Keep learning everyday</p>
        </div>

        <!-- Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="navTo('home-screen', this)"><i class="fa-solid fa-house"></i></div>
            <div class="nav-item" onclick="navTo('search-screen', this)"><i class="fa-solid fa-magnifying-glass"></i></div>
            <div class="nav-item center" onclick="navTo('upload-screen', this)"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item" onclick="navTo('profile-screen', this)"><i class="fa-solid fa-user"></i></div>
        </nav>
    </div>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyCgfnUdnZMEjIY86EyhG2GkRUdAaqksK9Y",
  authDomain: "video-call-app-f42f1.firebaseapp.com",
  databaseURL: "https://video-call-app-f42f1-default-rtdb.firebaseio.com",
  projectId: "video-call-app-f42f1",
  storageBucket: "video-call-app-f42f1.firebasestorage.app",
  messagingSenderId: "663021075318",
  appId: "1:663021075318:web:c081aec9442ef406ff1857"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();
        let userNode = null;

        function navTo(id, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(el) el.classList.add('active');
            if(id !== 'home-screen') document.querySelectorAll('video').forEach(v => v.pause());
        }

        const authEng = {
            go: () => {
                const em = document.getElementById('ae').value, pw = document.getElementById('ap').value;
                if(!em || !pw) return;
                auth.signInWithEmailAndPassword(em, pw).catch(() => {
                    auth.createUserWithEmailAndPassword(em, pw).then(res => {
                        db.ref('users/' + res.user.uid).set({ name: em.split('@')[0], coins: 50 });
                    });
                });
            }
        };

        auth.onAuthStateChanged(u => {
            if(u) { userNode = u; document.getElementById('auth-screen').style.display='none'; feedEng.load(); eco.start(); }
            else { document.getElementById('auth-screen').style.display='flex'; }
        });

        const feedEng = {
            add: () => {
                const url = document.getElementById('v-url').value, cap = document.getElementById('v-cap').value, cat = document.getElementById('v-cat').value;
                if(!url || !cap) return;
                const ref = db.ref('videos').push();
                ref.set({ videoId: ref.key, videoUrl: url, caption: cap, category: cat || 'General', likes: 0, uid: userNode.uid, name: userNode.email.split('@')[0] })
                .then(() => { navTo('home-screen'); document.getElementById('v-url').value=''; document.getElementById('v-cap').value=''; });
            },
            load: () => {
                db.ref('users/'+userNode.uid).on('value', s => { if(s.val()) { document.getElementById('u-coins').innerText = s.val().coins || 0; document.getElementById('p-name').innerText = s.val().name; } });
                db.ref('videos').on('value', snap => {
                    const box = document.getElementById('home-screen');
                    box.innerHTML = '';
                    if(!snap.val()) return;
                    Object.values(snap.val()).reverse().forEach(v => {
                        const div = document.createElement('div'); div.className = 'reel';
                        div.innerHTML = `
                            <video src="${v.videoUrl}" loop playsinline onclick="this.paused?this.play():this.pause()"></video>
                            <div class="overlay"><h4>@${v.name}</h4><p style="font-size:0.85rem;color:#ccc;margin-top:4px;">${v.caption}</p></div>
                            <div class="actions">
                                <div class="act-btn" onclick="feedEng.like('${v.videoId}', this)"><i class="fa-solid fa-heart"></i></div>
                                <span style="font-size:0.75rem;">${v.likes||0}</span>
                            </div>`;
                        box.appendChild(div);
                    });
                    feedEng.observe();
                });
            },
            like: (id, el) => {
                el.classList.toggle('liked');
                db.ref('videos/' + id + '/likes').transaction(c => (c || 0) + (el.classList.contains('liked') ? 1 : -1));
            },
            observe: () => {
                const ob = new IntersectionObserver(es => es.forEach(e => { const v = e.target.querySelector('video'); if(v) e.isIntersecting ? v.play().catch(()=>{}) : v.pause(); }), { threshold: 0.7 });
                document.querySelectorAll('.reel').forEach(r => ob.observe(r));
            }
        };

        const searchEng = {
            run: () => {
                const q = document.getElementById('sq').value.toLowerCase();
                if(!q) return;
                db.ref('videos').once('value', s => {
                    const res = document.getElementById('search-res'); res.innerHTML = '';
                    if(!s.val()) return;
                    Object.values(s.val()).forEach(v => {
                        if(v.caption.toLowerCase().includes(q) || v.category.toLowerCase().includes(q)) {
                            res.innerHTML += `<div style="background:var(--glass); padding:10px; border-radius:8px; margin-bottom:8px;"><b>${v.caption}</b><br><span style="font-size:0.75rem; color:var(--blue);">${v.category}</span></div>`;
                        }
                    });
                });
            }
        };

        const eco = { start: () => setInterval(() => { if(document.getElementById('home-screen').classList.contains('active')) db.ref('users/'+userNode.uid+'/coins').transaction(c => (c||0)+5); }, 20000) };
    </script>
</body>
</html>
